<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Hype Sneakers</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="shortcut icon" href="./img/shoes.png" type="image/png">
    
    <!-- 1. SCRIPT ANTI-PARPADEO: Se ejecuta de inmediato antes de pintar la página -->
    <script>
        const savedTheme = localStorage.getItem("tema");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const currentTheme = savedTheme ?? (prefersDark ? "oscuro" : "claro");
        if (currentTheme === "oscuro") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100 font-sans min-h-screen">

    <!-- Barra de Navegación -->
    <nav class="bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 shadow-sm py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-xl font-bold text-orange-500">Hype Sneakers</span>
            <div class="flex items-center gap-4">
                <a href="index.html" class="btn btn-outline text-sm">Gestión</a>
                <a href="catalog.html" class="btn btn-primary text-sm">Catálogo</a>
                
                <!-- 2. BOTÓN DE MODO OSCURO CON ACCESIBILIDAD -->
                <button id="themeToggle" class="btn btn-outline text-sm px-3 py-2" aria-label="Cambiar modo oscuro">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 space-y-8 pb-12">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <h1 class="text-2xl font-bold text-orange-500">Catálogo de Sneakers</h1>
            
            <!-- Barra de Búsqueda y Filtros requerida en el ítem 3.4 -->
            <div class="w-full md:w-auto flex gap-2">
                <input type="text" id="searchInput" class="input text-sm" placeholder="Buscar sneaker...">
            </div>
        </div>

        <!-- Contenedor del catálogo con grid responsive (1 / 2 / 3 columnas) -->
        <div id="catalogContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="card bg-white dark:bg-zinc-900 max-w-lg w-full relative p-6 space-y-4">
            <span id="closeModal" class="absolute top-3 right-4 text-2xl cursor-pointer font-bold hover:text-orange-500">&times;</span>
            <h2 id="modalName" class="text-xl font-bold text-orange-500"></h2>
            <img id="modalImg" src="" alt="Sneaker" class="w-full h-48 object-cover rounded-lg">
            <p id="modalCategory" class="badge"></p>
            <p id="modalDescription" class="text-sm text-gray-600 dark:text-gray-300"></p>
            <div class="flex justify-between items-center pt-2 border-t border-gray-100 dark:border-zinc-800">
                <p id="modalPrice" class="text-lg font-bold"></p>
                <p id="modalStock" class="text-sm text-gray-500"></p>
            </div>
        </div>
    </div>

    <!-- 3. SCRIPT DE INTERACCIÓN DEL BOTÓN DE TEMA -->
    <script>
        const themeToggleBtn = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");

        // Sincronizar el icono correcto según el estado actual
        if (document.documentElement.classList.contains("dark")) {
            themeIcon.textContent = "☀️";
        } else {
            themeIcon.textContent = "🌙";
        }

        // Evento click para alternar
        themeToggleBtn.addEventListener("click", () => {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("tema", isDark ? "oscuro" : "claro");
            themeIcon.textContent = isDark ? "☀️" : "🌙";
        });
    </script>

    <script type="module" src="./js/catalog.js"></script>
</body>
</html>
