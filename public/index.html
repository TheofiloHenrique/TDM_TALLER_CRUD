<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Hype Sneakers</title>
    <link rel="shortcut icon" href="./img/shoes.png" type="image/png">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
        const savedTheme = localStorage.getItem("tema");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const currentTheme = savedTheme ?? (prefersDark ? "oscuro" : "claro");
        if (currentTheme === "oscuro") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100 font-sans min-h-screen">

    <nav class="bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 shadow-sm py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-xl font-bold text-orange-500">Hype Sneakers</span>
            <div class="flex items-center gap-4">
                <a href="./index.html" class="btn btn-primary text-sm">Gestión</a>
                <a href="./catalog.html" class="btn btn-outline text-sm">Catálogo</a>
                
                <button id="themeToggle" class="btn btn-outline text-sm px-3 py-2" aria-label="Cambiar modo oscuro">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 space-y-8 pb-12">
        <!-- ⚠️ AVISO OFFLINE -->
        <div id="offlineBanner" class="hidden bg-orange-500/10 border border-orange-500 text-orange-500 p-3 rounded-xl text-center text-sm font-medium">
            ⚠️ Sin conexión — mostrando datos guardados en caché
        </div>

        <h1 class="text-2xl font-bold text-orange-500">Gestión de Sneakers</h1>

        <!-- Formulario -->
        <section class="card bg-white dark:bg-zinc-900 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-800">
            <form id="sneakerForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Nombre</label>
                    <input type="text" id="name" class="input" placeholder="Nombre del sneaker" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Categoría</label>
                    <input type="text" id="category" class="input" placeholder="Ej: Jordan, Yeezy" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Precio</label>
                    <input type="number" id="price" class="input" placeholder="Precio ($)" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Stock</label>
                    <input type="number" id="stock" class="input" placeholder="Stock disponible" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Imagen</label>
                    <input type="url" id="image" class="input" placeholder="URL de la imagen" required>
                </div>
                <div class="sm:col-span-2 lg:col-span-3">
                    <label class="block text-sm font-medium mb-1">Descripción</label>
                    <input type="text" id="description" class="input" placeholder="Descripción">
                </div>
                <div class="sm:col-span-2 lg:col-span-3 flex justify-end mt-2">
                    <button type="submit" id="submitBtn" class="btn btn-primary w-full sm:w-auto">Agregar</button>
                </div>
            </form>
        </section>

        <section class="card bg-white dark:bg-zinc-900 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-800 overflow-hidden">
            <h2 class="text-xl font-bold mb-4 text-orange-500">Inventario</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 dark:border-zinc-800 text-sm text-gray-500">
                            <th class="py-3 px-4">ID</th>
                            <th class="py-3 px-4">Nombre</th>
                            <th class="py-3 px-4">Descripción</th>
                            <th class="py-3 px-4">Categoría</th>
                            <th class="py-3 px-4">Precio</th>
                            <th class="py-3 px-4">Stock</th>
                            <th class="py-3 px-4">Image</th>
                            <th class="py-3 px-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="sneakersTable" class="divide-y divide-gray-100 dark:divide-zinc-800"></tbody>
                </table>
            </div>
        </section>
    </main>
    
    <script>
        const themeToggleBtn = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        if (document.documentElement.classList.contains("dark")) {
            themeIcon.textContent = "☀️";
        } else {
            themeIcon.textContent = "🌙";
        }
        themeToggleBtn.addEventListener("click", () => {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("tema", isDark ? "oscuro" : "claro");
            themeIcon.textContent = isDark ? "☀️" : "🌙";
        });
    </script>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/pwa.js"></script>
</body>
</html>
