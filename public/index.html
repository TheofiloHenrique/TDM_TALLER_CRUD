<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Hype Sneakers</title>
    <link rel="shortcut icon" href="./img/shoes.png" type="image/png">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="./index.html">Gestión</a></li>
            <li><a href="./catalog.html">Catálogo</a></li>
        </ul>
    </nav>

    <h1>Gestión de Sneakers</h1>

    <form id="sneakerForm">
        <input type="text" id="name" placeholder="Nombre del sneaker" required>
        <input type="text" id="description" placeholder="Descripción">
        <input type="text" id="category" placeholder="Categoría (Ej: Jordan, Yeezy)" required>
        <input type="number" id="price" placeholder="Precio ($)" required>
        <input type="number" id="stock" placeholder="Stock disponible" required>
        <input type="url" id="image" placeholder="URL de la imagen" required>
        <button type="submit" id="submitBtn">Agregar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Image</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="sneakersTable"></tbody>
    </table>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
