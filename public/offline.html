<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - Hype Sneakers</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script>
        const savedTheme = localStorage.getItem("tema");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if ((savedTheme ?? (prefersDark ? "oscuro" : "claro")) === "oscuro") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="card bg-white dark:bg-zinc-900 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-zinc-800 text-center max-w-md space-y-4">
        <span class="text-4xl">⚠️</span>
        <h1 class="text-2xl font-bold text-orange-500">Sin conexión a Internet</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">
            Parece que has perdido la conexión. Comprueba tu red para seguir navegando por todo el catálogo.
        </p>
        <button onclick="window.location.reload()" class="btn btn-primary w-full">Reintentar</button>
    </div>
</body>
</html>
